name: code-map

# Nightly, devkit's shared code-map workflow measures this repository's modules and functions and publishes code-map.json
# to the code-map branch, where the Capsid system explorer reads it. Never a gate on a pull request. Not on every push: a
# run per merge took a runner while the account's 20 were the bottleneck (devkit README, "No second run on main").
# Monday's run (its own cron line) and a manual one also run the Stryker chunks of stryker.config.mjs; the other nights
# reuse its numbers and mark a function changed since as stale.

on:
  schedule:
    - cron: "17 4 * * 0,2-6"
    - cron: "17 4 * * 1"
  workflow_dispatch:

# One run at a time, so a nightly map never overwrites the weekly mutation run while it is still going.
concurrency:
  group: code-map
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  code-map:
    # A called workflow holds no more than this job grants: the write lets it push code-map.json to the code-map branch.
    permissions:
      contents: write
    uses: DrDustinEdwards/devkit/.github/workflows/code-map.yml@72b44bea46d4316e1bd4bf335b77ca420b802910 # v0.45.0
    with:
      coverage-command: npx vitest run --coverage.enabled --coverage.provider=v8 --coverage.reporter=json --coverage.include=src/**
      mutation-command: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1') && 'npm i --no-save @stryker-mutator/core@9.6.1 @stryker-mutator/vitest-runner@9.6.1 && for c in drill dump restore runs rest; do STRYKER_CHUNK=$c npx stryker run; done' || '' }}
      mutation-file: reports/mutation/*.json
      timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1') && 120 || 20 }}
