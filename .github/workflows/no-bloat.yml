name: no-bloat

# Knip, jscpd and the test count against the committed baseline in .no-bloat.json (devkit's no-bloat ratchet, checklist
# E1). A count above its baseline fails; `npm run bloat` runs the same check locally, and `npx devkit-no-bloat
# --write-baseline` records a new baseline in the change that moves it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-bloat:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@e2914d9fdd2b2ef4eb7d393db739c3bb2a808583 # v0.23.0
