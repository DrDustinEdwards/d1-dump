name: shared

# devkit's shared-code check: pins behind the newest release, local copies of shared code, a shared feature this site lacks,
# and British spelling. Exceptions are in .shared.json with their reasons. What is shared:
# https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shared:
    uses: DrDustinEdwards/devkit/.github/workflows/shared.yml@65782d2c45431055672a315f0d126b62d0dd3aff # v0.20.14
