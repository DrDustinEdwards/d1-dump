name: release

# Merging a version bump to main is the release: devkit's release.yml tags it and publishes the GitHub release, then
# bump-consumers.yml starts Renovate in every repository that depends on it. Run it by hand to release a version that
# merged without a tag (0.7.0 did).

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: DrDustinEdwards/devkit/.github/workflows/release.yml@71f342e07f91d3be216f2dfd8e9815a0f9f7299c # v0.20.13

  bump:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: DrDustinEdwards/devkit/.github/workflows/bump-consumers.yml@71f342e07f91d3be216f2dfd8e9815a0f9f7299c # v0.20.13
    secrets:
      token: ${{ secrets.RENOVATE_TRIGGER_TOKEN }}
