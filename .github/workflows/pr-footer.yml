name: pr-footer

# No "Generated by Claude Code" footer on a pull request description: a cloud session's GitHub connection appends one to
# every description it writes and puts it back when removed, so this removes it after the fact (Dustin, 2026-10-14). The
# work is devkit's shared pr-footer.yml, pinned by full sha. Run it by hand once to clean every past pull request.

on:
  pull_request:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-footer:
    # A called workflow holds no more than this job grants, contents: read included, which the shared file declares.
    permissions:
      contents: read
      pull-requests: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr-footer.yml@27e0a1ca0747b5839bf7e0433c307ae671de8501 # v0.7.0
