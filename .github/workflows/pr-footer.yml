name: pr-footer

# No "Generated by Claude Code" footer on a pull request description: a cloud session's GitHub connection appends one to
# every description it writes and puts it back when removed, so this removes it after the fact (Dustin, 2026-10-14). The
# work is devkit's shared pr-footer.yml, pinned by full sha. Run it by hand once to clean every past pull request.

on:
  pull_request:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: pr-footer-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-footer:
    # A called workflow holds no more than this job grants, contents: read included, which the shared file declares.
    permissions:
      contents: read
      pull-requests: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr-footer.yml@d9d5a3448a50f183c3c8b4a5f293717728717245 # v0.20.8
