name: dependencies

# The caller a repository keeps. Replace the sha with the devkit commit that holds the reviewed dependencies.yml, and keep it
# a full sha: scripts/check-callers.mjs fails on anything else. The daily run is what finds an advisory published after a
# merge. Exceptions go in osv-scanner.toml at the repository root, each with its reason.

# pr.yml (checks.yml) scans every pull request, so this keeps only the daily run, which finds an advisory published after
# a merge (devkit README, "No second run on main").
on:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    uses: DrDustinEdwards/devkit/.github/workflows/dependencies.yml@89fc1eabd3405fb0d756087bc3a23ae22e3f159c # v0.50.1
