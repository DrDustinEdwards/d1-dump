name: dependencies

# The caller a repository keeps. Replace the sha with the devkit commit that holds the reviewed dependencies.yml, and keep it
# a full sha: scripts/check-callers.mjs fails on anything else. The daily run is what finds an advisory published after a
# merge. Exceptions go in osv-scanner.toml at the repository root, each with its reason.

# A pull request or push runs it only when a manifest or lockfile changes; the daily run finds a new advisory.
on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "osv-scanner.toml"
      - ".github/workflows/dependencies.yml"
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "osv-scanner.toml"
      - ".github/workflows/dependencies.yml"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    uses: DrDustinEdwards/devkit/.github/workflows/dependencies.yml@71f342e07f91d3be216f2dfd8e9815a0f9f7299c # v0.20.13
