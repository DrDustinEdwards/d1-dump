name: checks

# Every pull request check in one job (devkit's pr.yml): the footer strip, the trailer check, the shared-code check,
# OSV-Scanner, actionlint and zizmor when .github/ changes, the no-bloat ratchet and the reviewer (README of devkit, "One
# job per pull request"). Exceptions to the shared-code check are in .shared.json with their reasons; to OSV-Scanner in
# osv-scanner.toml; to the workflow audit in .github/actionlint.yaml and .github/zizmor.yml. What is shared:
# https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
#
# No push to main: a merge was checked as its pull request, and the ruleset lets nothing else onto main. The job id is
# `checks`, so the check is "checks / Repo checks", the name the ruleset requires.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  # Once a day on the default branch: the shared-code check judges the repository's state there, which a pull request's
  # run leaves to it (devkit pr.yml, "THE CALLER"). A red run is Capsid's job for this repository.
  schedule:
    - cron: "53 5 * * *"
  # Run by hand once to clean the footer from every past pull request.
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@9e40afbad5fa778718b9aac65bc205b3c0a9c101 # v0.51.0
    with:
      review: true
      # A library, not a Worker.
      worker-size: false
