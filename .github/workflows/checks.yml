name: checks

# devkit's small checks in one job (checks.yml): the "Generated by Claude Code" footer removed from pull request
# descriptions, no AI trailer or author on new commits, and the shared-code check. Exceptions to the shared-code check are
# in .shared.json with their reasons. What is shared: https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
# Run it by hand once to clean the footer from every past pull request.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does. An edit of the
# description has a group of its own, so it never cancels a run that is checking the code.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.action == 'edited') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # A called workflow holds no more than this job grants, contents: read included, which the shared file declares.
    permissions:
      contents: read
      pull-requests: write
    uses: DrDustinEdwards/devkit/.github/workflows/checks.yml@8390c62de180aa316f12d141a0cc42d00a714f74 # v0.20.23
