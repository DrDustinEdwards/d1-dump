name: ai-author

# Devkit's gate that refuses an AI attribution trailer on a commit a push or pull request adds
# (and a commit authored or committed as Claude on a pull request): portfolio rule, no AI
# attribution on any commit. This repository has no other use for devkit, so the bin comes from
# the tag passed as `devkit` below, not from package.json. The workflow is pinned by full sha,
# which devkit's scripts/check-callers.mjs requires.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ai-author-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@d9d5a3448a50f183c3c8b4a5f293717728717245 # v0.20.8
    with:
      devkit: DrDustinEdwards/devkit#v0.20.8
